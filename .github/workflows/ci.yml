name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Set up protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "28.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files need formatting:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify generated code
        run: make proto-check

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Build
        run: go build ./...

      - name: Benchmark smoke test
        run: make benchmark-smoke

      - name: Validate Compose configuration
        run: |
          docker compose -f deploy/docker-compose.yml config --quiet
          MINIRPC_TLS_DIR=/tmp/minirpc-tls-config \
            docker compose -f deploy/docker-compose.yml \
            -f deploy/docker-compose.tls.yml config --quiet

  docker-smoke:
    name: Docker smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run discovery RPC and metrics smoke test
        run: make docker-test

      - name: Run mutual-TLS discovery RPC smoke test
        run: make docker-tls-test

      - name: Run live TLS certificate rotation smoke test
        run: make docker-tls-rotation-test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
