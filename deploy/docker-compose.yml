services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    command:
      - etcd
      - --name=etcd0
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd0=http://etcd:2380
      - --initial-cluster-token=mini-rpc
      - --initial-cluster-state=new
    ports:
      - "127.0.0.1:${MINIRPC_ETCD_PORT:-2379}:2379"
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 2s
      timeout: 2s
      retries: 20

  echo-a:
    build:
      context: ..
      target: server
    command:
      - -addr=0.0.0.0:8080
      - -advertise-addr=echo-a:8080
      - -instance-id=echo-a
      - -etcd-endpoints=etcd:2379
      - -lease-ttl=5s
      - -metrics-addr=0.0.0.0:9090
    depends_on:
      etcd:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MINIRPC_ECHO_A_METRICS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/metrics"]
      interval: 2s
      timeout: 2s
      retries: 20

  echo-b:
    build:
      context: ..
      target: server
    command:
      - -addr=0.0.0.0:8080
      - -advertise-addr=echo-b:8080
      - -instance-id=echo-b
      - -etcd-endpoints=etcd:2379
      - -lease-ttl=5s
      - -metrics-addr=0.0.0.0:9090
    depends_on:
      etcd:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MINIRPC_ECHO_B_METRICS_PORT:-9091}:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/metrics"]
      interval: 2s
      timeout: 2s
      retries: 20

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      echo-a:
        condition: service_healthy
      echo-b:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MINIRPC_PROMETHEUS_PORT:-9092}:9090"

  echo-client:
    profiles: ["client"]
    build:
      context: ..
      target: client
    command:
      - -etcd-endpoints=etcd:2379
      - -message=docker-smoke-test
      - -observability=false
    depends_on:
      echo-a:
        condition: service_healthy
      echo-b:
        condition: service_healthy
