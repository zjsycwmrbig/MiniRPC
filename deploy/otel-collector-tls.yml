receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        tls:
          cert_file: /tls/server.crt
          key_file: /tls/server.key
          client_ca_file: /tls/ca.crt
          min_version: "1.2"

processors:
  batch:
    timeout: 500ms

exporters:
  debug:
    verbosity: detailed

service:
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
