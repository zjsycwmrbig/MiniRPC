syntax = "proto3";

package rpc.echo.v1;

option go_package = "github.com/zjsycwmrbig/mini-rpc/api/echo/v1;echov1";

// Echo is the first example service used to validate Mini-RPC end to end.
service Echo {
  // Echo returns the caller-provided message.
  rpc Echo(EchoRequest) returns (EchoResponse);
}

message EchoRequest {
  string message = 1;
}

message EchoResponse {
  string message = 1;
}
